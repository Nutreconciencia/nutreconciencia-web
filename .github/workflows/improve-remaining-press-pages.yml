name: Improve remaining press pages

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-press:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Improve remaining press pages
        run: python scripts/improve_remaining_press_pages.py

      - name: Verify all 11 pages
        run: |
          python - <<'PY'
          from pathlib import Path
          slugs = ['20minutos-piramide', 'actual-fruveg', 'agencia-sinc-nutricion', 'eldiario-greenwashing', 'instituto-nutrigenomica', 'la-vanguardia-seeds', 'la-voz-galicia-meat', 'la-voz-galicia-omniveg', 'pcrm-omniveg', 'plantrician-omniveg', 'vozpopuli-omniveg']
          generic = "Aparición pública vinculada a investigación, divulgación o análisis de nutrición y salud."
          found = []
          for slug in slugs:
              p = Path("prensa") / slug / "index.html"
              text = p.read_text(encoding="utf-8", errors="ignore")
              if generic in text:
                  found.append(slug)
          if found:
              print("Generic copy still present in:")
              for slug in found:
                  print(" -", slug)
              raise SystemExit(1)
          print("All 11 remaining press pages have non-generic lead copy.")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prensa
          git diff --cached --quiet || git commit -m "content: improve remaining press pages"
          git push
