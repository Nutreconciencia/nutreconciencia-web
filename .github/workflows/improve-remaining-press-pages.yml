name: Improve remaining press pages

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  improve-press:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Improve remaining press pages
        run: python scripts/improve_remaining_press_pages.py

      - name: Verify no original generic lead remains
        run: |
          if grep -R -n \
            "Aparición pública vinculada a investigación, divulgación o análisis de nutrición y salud." \
            prensa/20minutos-piramide \
            prensa/actual-fruveg \
            prensa/agencia-sinc-nutricion \
            prensa/eldiario-greenwashing \
            prensa/instituto-nutrigenomica \
            prensa/la-vanguardia-seeds \
            prensa/la-voz-galicia-meat \
            prensa/la-voz-galicia-omniveg \
            prensa/pcrm-omniveg \
            prensa/plantrician-omniveg \
            prensa/vozpopuli-omniveg; then
            echo "Original generic lead still present."
            exit 1
          fi
          echo "Original generic lead not found in the 11 target pages."

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prensa
          git diff --cached --quiet || git commit -m "content: improve remaining press pages"
          git push
