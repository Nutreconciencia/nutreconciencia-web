name: Finalize DOI publication sitemap safely

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore definitive publication sitemap
        run: python scripts/finalize_doi_publications_safe.py

      - name: Verify exactly 52 article URLs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path("sitemap.xml").read_text(encoding="utf-8", errors="ignore")
          urls = set(re.findall(
              r'<loc>https://nutreconciencia\.com/articulos/([^/<]+)/</loc>',
              text
          ))

          # Exclude the article index root; regex above already requires a slug.
          print("Unique article detail URLs in sitemap:", len(urls))

          expected_new = "when-ultra-processing-obscures-sustainable-dietary-transitions"
          if expected_new not in urls:
              print("Missing new DOI article:", expected_new)
              raise SystemExit(1)

          if len(urls) != 52:
              print("Expected 52 article detail URLs.")
              raise SystemExit(1)

          print("Article sitemap verification: PASS")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "fix: verify definitive publication sitemap"
          git push

