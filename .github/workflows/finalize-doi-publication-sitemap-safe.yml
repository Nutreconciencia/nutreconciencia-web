name: Finalize DOI publication sitemap safely

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore definitive publication sitemap
        run: python scripts/finalize_doi_publications_safe.py

      - name: Verify expected article count
        run: |
          count=$(grep -o 'https://nutreconciencia.com/articulos/[^<]*' sitemap.xml | sort -u | wc -l)
          echo "Article URLs in sitemap: $count"
          test "$count" -eq 52

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "fix: restore definitive publication sitemap"
          git push
