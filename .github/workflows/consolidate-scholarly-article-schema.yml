name: Consolidate ScholarlyArticle schema

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consolidate ScholarlyArticle schema
        run: python scripts/consolidate_scholarly_article_schema.py

      - name: Verify one generated schema per canonical page
        run: |
          count=$(grep -R -l 'id="nutreconciencia-scholarly-article-schema"' articulos/*/index.html | wc -l)
          echo "Generated ScholarlyArticle pages: $count"
          test "$count" -eq 51

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "chore: consolidate ScholarlyArticle schema"
          git push
