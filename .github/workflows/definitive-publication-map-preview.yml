name: Definitive publication map preview

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build definitive publication map preview
        run: python scripts/definitive_publication_map_preview.py

      - name: Commit preview reports
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add definitive_publication_map.md definitive_publication_map.csv
          git diff --cached --quiet || git commit -m "chore: preview definitive publication map"
          git push
