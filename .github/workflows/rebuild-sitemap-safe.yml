name: Rebuild sitemap safely

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild valid sitemap
        run: python scripts/rebuild_sitemap_safe.py
      - name: Validate sitemap XML
        run: |
          python - <<'PY'
          import re, xml.etree.ElementTree as ET
          from pathlib import Path
          text=Path("sitemap.xml").read_text(encoding="utf-8",errors="ignore")
          ET.parse("sitemap.xml")
          urls=re.findall(r"<loc>([^<]+)</loc>",text)
          if len(urls)!=len(set(urls)): raise SystemExit("Duplicate sitemap URLs found")
          if any("https://nutreconciencia.com/https://" in u for u in urls):
              raise SystemExit("Malformed duplicated-domain URL found")
          expected="https://nutreconciencia.com/articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/"
          if expected not in urls: raise SystemExit("New DOI article missing")
          print("Sitemap LOC entries:",len(urls))
          print("Sitemap XML verification: PASS")
          PY
      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "fix: rebuild valid sitemap XML"
          git push
