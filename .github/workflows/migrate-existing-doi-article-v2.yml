name: Migrate existing DOI article v2
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild target article with editorial template
        run: python scripts/migrate_existing_doi_article_v2.py
      - name: Verify generated page
        run: |
          grep -n 'class="study-hero article-top"' articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/index.html
          grep -n 'class="study-layout article-layout"' articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/index.html
          grep -n 'id="nutreconciencia-scholarly-article-schema"' articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/index.html
          grep -n 'Ver DOI' articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/index.html
      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos/when-ultra-processing-obscures-sustainable-dietary-transitions
          git diff --cached --quiet || git commit -m "fix: rebuild DOI article with editorial template"
          git push
