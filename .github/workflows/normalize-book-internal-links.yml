name: Normalize book page internal links

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize-book:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize book page links
        run: python scripts/normalize_book_internal_links.py

      - name: Verify canonical book page links
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("libro/index.html").read_text(encoding="utf-8", errors="ignore")
          expected = [
              'href="/"',
              'href="/articulos/"',
              'href="/prensa/"',
              'href="/libro/"',
              'href="/sobre-mi/"',
              'href="/podcasts/"',
              'href="/#sobre-mi"',
          ]
          missing = [x for x in expected if x not in text]
          if missing:
              print("MISSING:")
              for x in missing:
                  print(" -", x)
              raise SystemExit(1)
          print("All canonical book page links verified.")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add libro/index.html
          git diff --cached --quiet || git commit -m "fix: normalize book page internal links"
          git push
