name: Add paper by DOI
"on":
  workflow_dispatch:
    inputs:
      doi:
        description: "DOI del nuevo artículo"
        required: true
        type: string
permissions:
  contents: write
jobs:
  add-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create publication from DOI
        run: python scripts/add_paper_by_doi.py "${{ inputs.doi }}"
      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "feat: add publication from DOI"
          git push
