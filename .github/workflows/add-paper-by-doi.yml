name: Add paper by DOI
"on":
  workflow_dispatch:
    inputs:
      doi:
        description: "DOI del artículo"
        required: true
        type: string
permissions:
  contents: write
jobs:
  add-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create paper from DOI
        run: python scripts/add_paper_by_doi.py "${{ inputs.doi }}"
      - name: Verify generated page
        run: |
          python -m py_compile scripts/add_paper_by_doi.py
          echo "Python syntax: PASS"
          python - <<'PY'
          import json
          from pathlib import Path
          metas = sorted(Path("articulos").glob("*/metadata.json"), key=lambda p: p.stat().st_mtime, reverse=True)
          if not metas:
              raise SystemExit("No metadata.json found")
          meta = metas[0]
          data = json.loads(meta.read_text(encoding="utf-8"))
          html = (meta.parent / "index.html").read_text(encoding="utf-8")
          checks = {
              "canonical": '<link rel="canonical"' in html,
              "v28": 'styles.css?v=28' in html,
              "ScholarlyArticle": 'id="nutreconciencia-scholarly-article-schema"' in html,
              "paper-layout": 'class="study-hero article-top"' in html and 'class="study-layout article-layout"' in html,
              "doi-button": 'Ver DOI' in html,
          }
          for key, ok in checks.items():
              print(f"{key}: {'PASS' if ok else 'FAIL'}")
              if not ok:
                  raise SystemExit(f"Verification failed: {key}")
          print("PMID:", data.get("pmid") or "not found")
          print("Abstract:", "FOUND" if data.get("abstract") else "NOT FOUND")
          print("Generated DOI paper verification: PASS")
          PY
      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "feat: add publication from DOI"
          git push
