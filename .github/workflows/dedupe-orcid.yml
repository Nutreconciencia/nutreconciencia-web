name: Clean ORCID duplicates

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedupe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consolidate duplicate ORCID folders
        run: python scripts/dedupe_orcid.py

      - name: Commit changes
        run: |
          git config user.name "nutreconciencia-orcid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "chore: consolidate ORCID duplicates"
          git push
