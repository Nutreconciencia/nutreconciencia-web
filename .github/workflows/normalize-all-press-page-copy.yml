name: Normalize all press page copy

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize all press page copy
        run: python scripts/normalize_all_press_page_copy.py

      - name: Verify no known generic copy remains
        run: |
          python - <<'PY'
          from pathlib import Path
          variants = [
              "Aparición pública vinculada a investigación, divulgación o análisis de nutrición y salud.",
              "Esta ficha recoge el titular, el medio y la fecha y enlaza directamente a la fuente original.",
              "Una ficha de prensa que recoge la aparición de Miguel López Moreno, resume brevemente su enfoque y enlaza a la publicación original.",
              "Una ficha de prensa que recoge la aparición de Miguel López Moreno y enlaza a la publicación original.",
              "Esta ficha recoge la aparición de Miguel López Moreno y enlaza a la publicación original.",
          ]
          found = []
          for p in Path("prensa").glob("*/index.html"):
              text = p.read_text(encoding="utf-8", errors="ignore")
              if any(v in text for v in variants):
                  found.append(str(p))
          if found:
              print("Known generic template copy still present:")
              for p in found:
                  print(" -", p)
              raise SystemExit(1)
          print("No known generic template copy remains in press pages.")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prensa
          git diff --cached --quiet || git commit -m "content: normalize all press page copy"
          git push
