name: Migrate existing DOI article to editorial template
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/migrate_existing_doi_article.py
      - run: |
          grep -n 'id="nutreconciencia-scholarly-article-schema"' articulos/when-ultra-processing-obscures-sustainable-dietary-transitions/index.html
      - run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos/when-ultra-processing-obscures-sustainable-dietary-transitions
          git diff --cached --quiet || git commit -m "fix: match DOI article editorial template"
          git push
