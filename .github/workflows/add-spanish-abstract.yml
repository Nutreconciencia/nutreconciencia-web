name: Add Spanish abstract to DOI or ORCID paper

on:
  workflow_dispatch:
    inputs:
      article_slug:
        description: "Slug del artículo. También puedes usar articulos/slug."
        required: true
        type: string

      spanish_summary:
        description: "Resumen en español. Usa ||| para separar párrafos. Usa **negrita** y [[BIG]]texto grande[[/BIG]]."
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Spanish abstract
        env:
          ARTICLE_SLUG: ${{ inputs.article_slug }}
          SPANISH_SUMMARY: ${{ inputs.spanish_summary }}
        run: python scripts/add_spanish_abstract.py

      - name: Verify
        env:
          ARTICLE_SLUG: ${{ inputs.article_slug }}
        run: |
          python -m py_compile scripts/add_spanish_abstract.py
          echo "Python syntax: PASS"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          slug = os.environ["ARTICLE_SLUG"].strip().strip("/")
          slug = slug.removeprefix("articulos/")

          folder = Path("articulos") / slug
          html_path = folder / "index.html"

          if not html_path.exists():
              raise SystemExit(f"No existe {html_path}")

          metadata_path = folder / "metadata.json"
          orcid_path = folder / "orcid.json"

          if metadata_path.exists():
              meta_path = metadata_path
          elif orcid_path.exists():
              meta_path = orcid_path
          else:
              raise SystemExit(
                  f"No existe metadata.json ni orcid.json en {folder}"
              )

          html = html_path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          meta = json.loads(
              meta_path.read_text(
                  encoding="utf-8"
              )
          )

          checks = {
              "html": html_path.exists(),
              "metadata-source": meta_path.exists(),
              "spanish-abstract": bool(meta.get("abstract_spanish")),
              "manual-source": (
                  meta.get("translation_provider") == "manual"
              ),
              "editorial-source": (
                  meta.get("editorial_summary_source")
                  == "user_provided"
              ),
              "clean-template-or-legacy": (
                  '<div class="clean-summary">' in html
                  or '<p class="summary-lead">' in html
              ),
          }

          for key, ok in checks.items():
              print(f"{key}: {'PASS' if ok else 'FAIL'}")
              if not ok:
                  raise SystemExit(
                      f"Verification failed: {key}"
                  )

          print("Spanish abstract update verification: PASS")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"

          git add articulos

          git diff --cached --quiet || git commit \
            -m "content: add reviewed Spanish abstract"

          git push
