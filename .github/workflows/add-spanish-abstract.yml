name: Add Spanish abstract to DOI paper

"on":
  workflow_dispatch:
    inputs:
      article_slug:
        description: "Slug del artículo. Puedes usar también articulos/slug."
        required: true
        type: string
      spanish_summary:
        description: "Resumen en español. Usa ||| para separar párrafos. Usa **negrita** y [[BIG]]texto grande[[/BIG]]."
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Spanish abstract
        env:
          ARTICLE_SLUG: ${{ inputs.article_slug }}
          SPANISH_SUMMARY: ${{ inputs.spanish_summary }}
        run: python scripts/add_spanish_abstract.py

      - name: Verify
        env:
          ARTICLE_SLUG: ${{ inputs.article_slug }}
        run: |
          python -m py_compile scripts/add_spanish_abstract.py
          echo "Python syntax: PASS"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          slug = os.environ["ARTICLE_SLUG"].strip().strip("/")
          slug = slug.removeprefix("articulos/")

          folder = Path("articulos") / slug
          html_path = folder / "index.html"
          meta_path = folder / "metadata.json"

          if not html_path.exists():
              raise SystemExit(f"No existe {html_path}")
          if not meta_path.exists():
              raise SystemExit(f"No existe {meta_path}")

          html = html_path.read_text(encoding="utf-8")
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          checks = {
              "summary-lead": '<p class="summary-lead">' in html,
              "summary-section": '<h2 id="s1">Resumen del artículo</h2>' in html,
              "spanish-abstract": bool(meta.get("abstract_spanish")),
              "manual-source": meta.get("translation_provider") == "manual",
          }

          for key, ok in checks.items():
              print(f"{key}: {'PASS' if ok else 'FAIL'}")
              if not ok:
                  raise SystemExit(f"Verification failed: {key}")

          print("Spanish abstract update verification: PASS")
          PY

      - name: Commit
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "content: add reviewed Spanish abstract"
          git push
