name: Sync ORCID publications

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"

permissions:
  contents: write

jobs:
  sync-orcid:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync ORCID publications
        run: python3 scripts/sync_orcid.py

      - name: Commit changes
        run: |
          git config user.name "nutreconciencia-orcid-bot"
          git config user.email "actions@users.noreply.github.com"
          git add articulos
          git diff --cached --quiet || git commit -m "chore: sync ORCID publications"
          git push
