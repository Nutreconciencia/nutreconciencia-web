name: Audit press pages

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit press pages
        run: python scripts/audit_press_pages.py

      - name: Commit audit reports
        run: |
          git config user.name "nutreconciencia-seo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add press_pages_audit.md press_pages_audit.csv
          git diff --cached --quiet || git commit -m "chore: audit press pages"
          git push
